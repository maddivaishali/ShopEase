```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEase Shopping App</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    color: #222;
}

header {
    background: #1565c0;
    color: white;
    padding: 18px;
    text-align: center;
}

header h1 {
    margin: 0 0 12px;
}

.search {
    width: 95%;
    max-width: 500px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
}

.categories {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 15px 8px;
}

.categories button,
.action-button {
    background: #1565c0;
    color: white;
    border: none;
    padding: 10px 14px;
    border-radius: 7px;
    cursor: pointer;
}

h2 {
    text-align: center;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
    gap: 14px;
    padding: 15px;
    max-width: 1100px;
    margin: auto;
}

.product {
    background: white;
    padding: 12px;
    text-align: center;
    border-radius: 12px;
    box-shadow: 0 2px 7px #ddd;
}

.product img {
    width: 100%;
    height: 115px;
    object-fit: contain;
}

.product h3 {
    font-size: 16px;
}

.price {
    color: #087b36;
    font-weight: bold;
}

.product button {
    background: #ff9800;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 7px;
    cursor: pointer;
}

#cart {
    background: white;
    margin: 15px;
    padding: 18px;
    border-radius: 12px;
}

.cart-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #eee;
}

.remove {
    color: #c62828;
    border: none;
    background: transparent;
    cursor: pointer;
}

footer {
    background: #1565c0;
    color: white;
    text-align: center;
    padding: 15px;
    margin-top: 25px;
}
</style>
</head>

<body>

<header>
    <h1>🛍️ ShopEase</h1>
    <p>Everything you need, in one place!</p>

    <input
        id="search"
        class="search"
        type="search"
        placeholder="Search for products..."
        oninput="showProducts()">
</header>

<nav class="categories">
    <button onclick="setCategory('All')">All</button>
    <button onclick="setCategory('Fashion')">Fashion</button>
    <button onclick="setCategory('Electronics')">Electronics</button>
    <button onclick="setCategory('Groceries')">Groceries</button>
</nav>

<h2>✨ Our Products</h2>

<div id="products" class="products"></div>

<section id="cart">
    <h2>🛒 My Shopping Cart</h2>
    <div id="cartItems">Your cart is empty.</div>
    <h3 id="total">Total: ₹0</h3>
    <button class="action-button" onclick="checkout()">
        Place Order
    </button>
    <p id="message"></p>
</section>

<footer>
    <p>ShopEase — Happy Shopping! ❤️</p>
</footer>

<script>
const products = [
    {
        id: 1,
        name: "T-Shirt",
        price: 499,
        category: "Fashion",
        image: "https://placehold.co/200x150?text=T-Shirt"
    },
    {
        id: 2,
        name: "Shoes",
        price: 999,
        category: "Fashion",
        image: "https://placehold.co/200x150?text=Shoes"
    },
    {
        id: 3,
        name: "Smart Watch",
        price: 1499,
        category: "Electronics",
        image: "https://placehold.co/200x150?text=Watch"
    },
    {
        id: 4,
        name: "Headphones",
        price: 799,
        category: "Electronics",
        image: "https://placehold.co/200x150?text=Headphones"
    },
    {
        id: 5,
        name: "Rice (5 kg)",
        price: 350,
        category: "Groceries",
        image: "https://placehold.co/200x150?text=Rice"
    },
    {
        id: 6,
        name: "Apples (1 kg)",
        price: 180,
        category: "Groceries",
        image: "https://placehold.co/200x150?text=Apples"
    }
];

let cart = [];
let selectedCategory = "All";

function showProducts() {
    const search = document
        .getElementById("search")
        .value.toLowerCase();

    const filtered = products.filter(product => {
        const matchesSearch =
            product.name.toLowerCase().includes(search);

        const matchesCategory =
            selectedCategory === "All" ||
            product.category === selectedCategory;

        return matchesSearch && matchesCategory;
    });

    const container = document.getElementById("products");
    container.innerHTML = "";

    if (filtered.length === 0) {
        container.textContent = "No products found.";
        return;
    }

    filtered.forEach(product => {
        container.innerHTML += `
            <div class="product">
                <img
                    src="${product.image}"
                    alt="${product.name}">
                <h3>${product.name}</h3>
                <p>${product.category}</p>
                <p class="price">₹${product.price}</p>
                <button onclick="addToCart(${product.id})">
                    Add to Cart
                </button>
            </div>
        `;
    });
}

function setCategory(category) {
    selectedCategory = category;
    showProducts();
}

function addToCart(id) {
    const item = cart.find(product => product.id === id);

    if (item) {
        item.quantity++;
    } else {
        const product = products.find(p => p.id === id);
        cart.push({...product, quantity: 1});
    }

    showCart();
}

function changeQuantity(id, amount) {
    const item = cart.find(product => product.id === id);

    if (!item) return;

    item.quantity += amount;

    if (item.quantity <= 0) {
        cart = cart.filter(product => product.id !== id);
    }

    showCart();
}

function removeFromCart(id) {
    cart = cart.filter(product => product.id !== id);
    showCart();
}

function showCart() {
    const container = document.getElementById("cartItems");
    const totalElement = document.getElementById("total");
    const message = document.getElementById("message");

    message.textContent = "";

    if (cart.length === 0) {
        container.textContent = "Your cart is empty.";
    } else {
        container.innerHTML = cart.map(item => `
            <div class="cart-row">
                <span>
                    ${item.name}<br>
                    ₹${item.price} × ${item.quantity}
                </span>

                <span>
                    <button onclick="changeQuantity(${item.id}, -1)">−</button>
                    ${item.quantity}
                    <button onclick="changeQuantity(${item.id}, 1)">+</button>
                    <button class="remove"
                        onclick="removeFromCart(${item.id})">
                        Remove
                    </button>
                </span>
            </div>
        `).join("");
    }

    const total = cart.reduce(
        (sum, item) => sum + item.price * item.quantity,
        0
    );

    totalElement.textContent = "Total: ₹" + total;
}

function checkout() {
    if (cart.length === 0) {
        document.getElementById("message").textContent =
            "Please add products to your cart first.";
        return;
    }

    const total = cart.reduce(
        (sum, item) => sum + item.price * item.quantity,
        0
    );

    document.getElementById("message").textContent =
        "Demo order created! Total: ₹" + total +
        ". No payment has been taken.";

    cart = [];
    showCart();
}

showProducts();
showCart();
</script>

</body>
</html>
